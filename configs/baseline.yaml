paths:
  data_root: data/raw/cedar/signatures
  metadata: data/splits/cedar_metadata.csv
  artifacts: artifacts/baseline

data:
  seed: 42
  train_ratio: 0.70
  val_ratio: 0.15
  pairs_per_epoch: 12000
  positive_fraction: 0.50
  skilled_negative_fraction: 0.70

preprocessing:
  image_size: 224
  crop_margin: 8
  min_ink_fraction: 0.0005
  max_ink_fraction: 0.50
  min_contrast: 10.0
  blur_threshold: 8.0
  min_dimension: 32

model:
  encoder: convnext_tiny
  pretrained: true
  embedding_dim: 256

training:
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0001
  margin: 0.5
  epochs: 30
  patience: 6
  num_workers: 0
  mixed_precision: true
  gradient_clip: 1.0
  seed: 42
